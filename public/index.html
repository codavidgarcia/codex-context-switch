<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
    <title>Context Switch</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="utility-header">
      <h1 data-i18n="title">Context</h1>
      <button class="language-button" id="languageButton" type="button" aria-label="Cambiar idioma a español">ES</button>
    </header>

    <main>
      <form id="settingsForm" novalidate>
        <section class="parameter" aria-labelledby="contextLabel">
          <label id="contextLabel" for="contextInput" data-i18n="contextWindow">Context window</label>
          <div class="value-row">
            <input id="contextInput" name="contextWindow" type="text" inputmode="numeric" value="1,000,000" autocomplete="off" spellcheck="false">
            <span data-i18n="tokens">tokens</span>
          </div>

          <div class="range-shell" id="rangeShell">
            <input id="contextRange" type="range" min="16000" max="1050000" step="1000" value="1000000" aria-label="Context window">
            <span class="current-notch" id="currentNotch" aria-hidden="true" hidden></span>
          </div>
          <div class="range-ends" aria-hidden="true">
            <span>16K</span>
            <span data-i18n="modelMax">1.05M max</span>
          </div>
          <p class="decision-note" data-i18n="decisionNote">More context keeps more of the task available, but uses more resources.</p>
        </section>

        <details class="advanced" id="advanced">
          <summary data-i18n="advanced">Advanced</summary>
          <div class="advanced-row">
            <label for="compactInput" data-i18n="compactAt">Compact history at</label>
            <div class="compact-field">
              <input id="compactInput" name="compactLimit" type="text" inputmode="numeric" value="900,000" autocomplete="off" spellcheck="false">
              <span data-i18n="tokens">tokens</span>
            </div>
            <button class="text-button" id="ratioButton" type="button" data-i18n="useNinety">Use 90%</button>
          </div>
        </details>

        <div class="form-message" id="formMessage" role="alert" hidden></div>
      </form>
    </main>

    <footer class="action-bar">
      <div class="action-cluster">
        <button class="primary-action" id="applyButton" type="submit" form="settingsForm" disabled>
          <span data-i18n="apply">Apply</span>
        </button>
        <button class="restore-action" id="restoreButton" type="button" hidden>
          <span data-i18n="restore">Restore original</span>
        </button>
      </div>
      <output class="result" id="result" aria-live="polite"></output>
    </footer>
  </body>
</html>
